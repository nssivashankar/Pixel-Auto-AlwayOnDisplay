Summary: Intelligent Always-On Display automation & battery health for Google Pixel
Description: |-
  Pixel Auto AOD is a high-performance utility designed specifically for Google Pixel devices.
  It intelligently manages your Always-On Display (AOD) while providing integrated Pixel
  battery health management and smart notification tracking.

  Features:
  - Charging Mode Automation: Automatically enables AOD when connected to a charger
  - Custom Battery Charging Limits: Set custom charging limits (80%–100%) to preserve battery health
  - Live Charging Status: View charging wattage, battery temperature, and ETAs on AOD
  - Live Notification Mode: Keeps AOD active for active tracking apps like Google Maps and Uber
  - Per-App Notifications: Select specific apps that trigger AOD when unread notifications arrive
  - Customizable Preview Duration: Set 5s to 60s AOD preview timeouts on lock or pickup
  - Material 3 Expressive UI: Built with Material You dynamic colors and smooth touch feedback

