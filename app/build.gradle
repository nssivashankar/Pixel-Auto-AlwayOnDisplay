import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.nssivashankar.pixelaod'
    // compileSdk must be 37+ because newer androidx dependencies (activity 1.13.0, core 1.18.0)
    // require Android 16/15QPR APIs to compile.
    compileSdk = 37

    signingConfigs {
        release {
            storeFile file("pixelautoaod.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "com.nssivashankar.pixelaod"
        minSdkVersion 26
        //noinspection OldTargetApi
        targetSdkVersion 35
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_21)
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = 'com.nssivashankar'
                artifactId = 'pixelaod'
                
                // Maven versions must be SemVer. We strip the 'v' prefix if present.
                def rawVersion = project.hasProperty('versionName') ? project.property('versionName') : '1.0.1'
                version = rawVersion.startsWith('v') ? rawVersion.substring(1) : rawVersion

                // Directly publish the APK file
                artifact(layout.buildDirectory.file("outputs/apk/release/app-release.apk"))
                
                pom {
                    name = "Pixel Auto AOD"
                    description = "Automated Always-On Display management for Pixel devices"
                    url = "https://github.com/nssivashankar/Pixel-Auto-AlwayOnDisplay"
                }
            }
        }
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/nssivashankar/Pixel-Auto-AlwayOnDisplay")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    def shizuku_version = "13.1.5"
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"

    compileOnly "dev.rikka.hidden:stub:4.4.0"
}
