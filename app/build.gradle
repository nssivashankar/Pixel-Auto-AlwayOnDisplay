import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.nssivashankar.pixelaod'
    // compileSdk must be 37+ because newer androidx dependencies (activity 1.13.0, core 1.18.0)
    // require Android 16/15QPR APIs to compile.
    compileSdk = 37

    def versionPropsFile = file('../version.properties')
    def versionProps = new Properties()
    if (versionPropsFile.exists()) {
        versionProps.load(new FileInputStream(versionPropsFile))
    }
    def vName = "${versionProps['major']}.${versionProps['minor']}.${versionProps['patch']}"
    def vCode = versionProps['code'].toInteger()

    buildFeatures {
        compose true
    }

    signingConfigs {
        release {
            storeFile file("pixelautoaod.jks")
            storePassword project.hasProperty('RELEASE_STORE_PASSWORD') ? project.property('RELEASE_STORE_PASSWORD') : System.getenv("KEYSTORE_PASSWORD")
            keyAlias project.hasProperty('RELEASE_KEY_ALIAS') ? project.property('RELEASE_KEY_ALIAS') : System.getenv("KEY_ALIAS")
            keyPassword project.hasProperty('RELEASE_KEY_PASSWORD') ? project.property('RELEASE_KEY_PASSWORD') : System.getenv("KEY_PASSWORD")
        }
    }

    defaultConfig {
        applicationId "com.nssivashankar.pixelaod"
        minSdkVersion 26
        //noinspection OldTargetApi
        targetSdkVersion 36
        versionCode vCode
        versionName vName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storePassword != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_21)
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Compose
    def compose_bom = platform('androidx.compose:compose-bom:2026.08.00')
    implementation compose_bom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha27'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'

    implementation "androidx.graphics:graphics-shapes:1.1.0"

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    def shizuku_version = "13.1.5"
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"

    implementation "androidx.work:work-runtime-ktx:2.10.0"

    compileOnly "dev.rikka.hidden:stub:4.4.0"
}

tasks.register("incrementVersion") {
    doLast {
        def versionPropsFile = file('../version.properties')
        if (versionPropsFile.exists()) {
            def versionProps = new Properties()
            versionPropsFile.withInputStream { versionProps.load(it) }
            
            def patch = (versionProps['patch'] ?: "0").toInteger() + 1
            def code = (versionProps['code'] ?: "1").toInteger() + 1
            
            versionProps['patch'] = patch.toString()
            versionProps['code'] = code.toString()
            versionPropsFile.withOutputStream { versionProps.store(it, "Pixel Auto AOD Versioning") }
            
            println "Version incremented to: ${versionProps['major']}.${versionProps['minor']}.${patch} (Code: ${code})"
        }
    }
}

tasks.register("releaseToGit") {
    doLast {
        def versionPropsFile = file('../version.properties')
        def versionProps = new Properties()
        versionPropsFile.withInputStream { versionProps.load(it) }
        def vName = "v${versionProps['major']}.${versionProps['minor']}.${versionProps['patch']}"
        
        exec {
            commandLine 'git', 'add', versionPropsFile.absolutePath
        }
        exec {
            commandLine 'git', 'commit', '-m', "Release $vName"
        }
        exec {
            commandLine 'git', 'tag', vName
        }
        exec {
            commandLine 'git', 'push', 'origin', 'master'
        }
        exec {
            commandLine 'git', 'push', 'origin', '--tags'
        }
        println "Git commit, tag $vName, and push to origin master successful."
    }
}

tasks.register("buildAndRelease") {
    dependsOn("assembleRelease")
    finalizedBy("incrementVersion", "releaseToGit")
}
