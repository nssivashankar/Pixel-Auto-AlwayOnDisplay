name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 37
          build-tools-version: 37.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          # Robust base64 decoding: remove any potential PEM headers and whitespace
          echo "$KEYSTORE_FILE" | sed 's/---.*---//g' | tr -d '[:space:]' | base64 --decode > app/pixelautoaod.jks
          
          if [ ! -s app/pixelautoaod.jks ]; then
            echo "❌ Error: Decoded keystore is empty! Check your KEYSTORE_FILE secret."
            exit 1
          fi

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW_VERSION="${{ github.ref_name }}"
            VERSION_NAME="${RAW_VERSION#v}"
          else
            VERSION_NAME="1.1.7"
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION_NAME"

      - name: Build and Sign Release APK
        run: ./gradlew assembleRelease -PversionName=${{ steps.version.outputs.version_name }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ Error: APK not found!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('Pixel Auto AOD {0}', github.ref_name) || 'Pixel Auto AOD Latest Build' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          make_latest: true
          body: |
            ### Pixel Auto AOD Release
            This build was automatically generated.
            
            **Version:** ${{ github.ref_type == 'tag' && github.ref_name || 'Development Build (Latest)' }}
            **Commit:** ${{ github.sha }}
            
            ### Features
            - Charging Mode: AoD automation
            - Live Notification Mode: Maps, Uber etc.
            - Per-App Notifications
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
