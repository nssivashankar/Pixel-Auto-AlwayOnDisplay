name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools-version: 35.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/pixelautoaod.jks
          
          if [ ! -s app/pixelautoaod.jks ]; then
            echo "❌ Error: Decoded keystore is empty! Check your KEYSTORE_BASE64 secret."
            exit 1
          fi

      - name: Build and Sign Release APK
        run: ./gradlew assembleRelease
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && format('Pixel Auto AOD {0}', github.ref_name) || 'Pixel Auto AOD Latest Build' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          make_latest: ${{ github.ref_type == 'tag' }}
          body: |
            ### Auto-Generated Build
            This release contains the latest changes from the `${{ github.ref_name }}` branch.
            
            **Commit:** ${{ github.sha }}
            
            ### Features
            - Charging Mode: AoD turns on when charger connected
            - Live Notification Mode: AoD for Maps, Uber etc.
            - Per-App Notifications: Select specific apps to trigger AoD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
