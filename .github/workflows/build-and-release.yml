name: Build and Create Release

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create/Update Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          release_name: Pixel Auto AOD Latest Build
          body: |
            ### Auto-Generated Build
            This release contains the latest changes from the `master` branch.

            **Commit:** ${{ github.sha }}

            ### Features
            - Charging Mode: AoD turns on when charger connected
            - Live Notification Mode: AoD for Maps, Uber etc.
            - Per-App Notifications: Select specific apps to trigger AoD

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
          draft: false
          prerelease: true